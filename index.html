<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PW144 Trade Tracker V3</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head><body><div class="wrap"><h1>⚔️ PW144 Trade Tracker V3</h1><div class="card"><h2>Mercado de Barras</h2><input id="barras" type="number" placeholder="Quantidade de Barras (100 Gold)"><input id="total" type="number" placeholder="Valor total em moedas"><div id="market"></div></div><div class="grid"><div class="card"><h2>Compra</h2><input id="money" type="number" placeholder="Moedas"><div id="buy"></div></div><div class="card"><h2>Venda</h2><input id="sellbars" type="number" placeholder="Barras"><div id="sell"></div></div></div><div class="grid"><div class="card"><h2>Lucro</h2><input id="held" type="number" placeholder="Barras compradas"><input id="buyprice" type="number" placeholder="Preço por barra"><div id="profit"></div></div><div class="card"><h2>Itens</h2><select id="item"><option value="38">Montaria 38 Gold</option><option value="12">Visual 12 Gold</option><option value="5">Pack 5 Gold</option><option value="3">Pedra do Céu 3 Gold</option></select><div id="itemv"></div></div></div><div class="card"><button onclick="exportCSV()">Exportar CSV</button><button onclick="clearHist()">Limpar Histórico</button></div><div class="stats" id="stats"></div><canvas id="chart"></canvas></div><script src="app.js"></script></body></html>
