<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PW Gold Tracker Pro</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head><body><div class="wrap"><h1>PW Gold Tracker Pro</h1><div class="card"><h3>Calculadora Gold</h3><input id="gold" type="number" placeholder="Qtd Gold"><input id="moedas" type="number" placeholder="Valor total em moedas"><div id="unit">0</div></div><div class="card"><h3>Compra</h3><input id="budget" type="number" placeholder="Moedas disponíveis"><div id="buy"></div></div><div class="card"><h3>Venda</h3><input id="sellGold" type="number" placeholder="Gold para vender"><div id="sell"></div></div><div class="card"><h3>Conversor de Item</h3><input id="itemGold" type="number" placeholder="Custo em Gold"><div id="item"></div></div><canvas id="chart"></canvas></div><script src="app.js"></script></body></html>
